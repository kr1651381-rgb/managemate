<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ManageMate Self-Study</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#f8fafc;color:#1e293b;padding-bottom:75px}
.top{background:#0f172a;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.wrap{max-width:850px;margin:16px auto;padding:0 14px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px;margin-bottom:14px}
.tag{display:inline-block;background:#ecfdf5;color:#059669;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;margin-bottom:8px}
h2{font-size:19px;color:#0f172a;margin-bottom:6px}
p{font-size:14px;line-height:1.5;color:#475569;margin-bottom:10px}
.btn{background:#0f172a;color:#fff;border:none;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
.btn-g{background:#10b981;color:#fff;border:none;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
.btn-o{background:#fff;color:#0f172a;border:1px solid #cbd5e1;padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
.bar{height:8px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:8px 0}
.fill{height:100%;background:#10b981;transition:.3s}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;display:flex;justify-content:space-around;padding:8px 0;z-index:10}
.nav button{background:none;border:none;font-size:11px;font-weight:600;color:#64748b;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.nav button.act{color:#059669}
.hide{display:none!important}
.fcard{background:#fff;border:2px solid #0f172a;border-radius:16px;padding:28px 20px;min-height:190px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;margin:12px 0}
.fcard.ans{background:#0f172a;color:#fff}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pill{padding:6px 12px;border-radius:20px;border:1px solid #cbd5e1;background:#fff;font-size:12px;font-weight:600;cursor:pointer}
.pill.act{background:#0f172a;color:#fff;border-color:#0f172a}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px;margin:6px 0 12px;font-size:14px}
.opt{display:block;width:100%;text-align:left;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;margin-top:6px;font-size:13px;cursor:pointer}
.opt.ok{background:#ecfdf5;border-color:#10b981;color:#065f46;font-weight:600}
.opt.no{background:#fef2f2;border-color:#ef4444;color:#991b1b}
pre{background:#f1f5f9;padding:12px;border-radius:10px;font-size:12px;white-space:pre-wrap;margin-top:8px}
</style>
</head>
<body>

<div class="top">
  <div><b>ManageMate</b> <span style="font-size:11px;color:#34d399;margin-left:6px">SELF-STUDY</span></div>
  <button class="btn-g" style="padding:6px 12px;font-size:12px" onclick="show('setup')">⚙️ Goal</button>
</div>

<div class="wrap">
  <div id="p-setup" class="card hide">
    <span class="tag">Personalize Study Plan</span>
    <h2>Set Your Self-Study Goal</h2>
    <label>Learner Level</label>
    <select id="s-role"><option>Student (School / College)</option><option>Independent Lifelong Learner</option><option>Competitive Exam Aspirant</option></select>
    <label>Biggest Study Challenge</label>
    <select id="s-chal"><option>Procrastination & Focus</option><option>Remembering Concepts (Retention)</option><option>Time Management</option></select>
    <label>Daily Study Target</label>
    <select id="s-goal"><option value="15">15 mins / day</option><option value="30">30 mins / day</option><option value="60">60 mins / day</option></select>
    <button class="btn" style="width:100%" onclick="saveSetup()">Save & Start Learning</button>
  </div>

  <div id="p-home">
    <div class="card">
      <span class="tag">🔥 4-Day Study Streak</span>
      <h2 id="h-title">Welcome, Self-Learner!</h2>
      <p id="h-rec"></p>
      <div style="font-size:13px;font-weight:600">Overall Mastery: <span id="h-pct" style="color:#059669">45%</span></div>
      <div class="bar"><div id="h-bar" class="fill" style="width:45%"></div></div>
      <div id="h-sub" style="font-size:12px;color:#64748b"></div>
    </div>
    <div class="card">
      <span class="tag">Next Lesson</span>
      <h2 id="h-next"></h2>
      <p id="h-nextd"></p>
      <button class="btn" onclick="show('lessons')">Start Lesson →</button>
    </div>
    <div class="card">
      <h2>Skill Mastery Pillars</h2>
      <div id="h-pillars"></div>
    </div>
  </div>

  <div id="p-lessons" class="hide">
    <div id="l-pills" class="pills"></div>
    <div id="l-body" class="card"></div>
  </div>

  <div id="p-cards" class="hide">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h2>Subject Flashcards</h2>
      <button class="btn" onclick="document.getElementById('c-add').classList.toggle('hide')">+ New Card</button>
    </div>
    <div id="c-add" class="card hide">
      <input id="nc-sub" placeholder="Subject (e.g. Science, History)">
      <input id="nc-q" placeholder="Question (Front)">
      <input id="nc-a" placeholder="Answer (Back)">
      <button class="btn-g" onclick="addCard()">Save Flashcard</button>
    </div>
    <div id="c-decks" class="pills"></div>
    <div style="font-size:12px;color:#64748b;display:flex;justify-content:space-between">
      <span id="c-cnt"></span><span id="c-st"></span>
    </div>
    <div id="c-box" class="fcard" onclick="flip()">
      <div id="c-tag" style="font-size:12px;opacity:.7;margin-bottom:10px"></div>
      <div id="c-txt" style="font-size:18px;font-weight:600"></div>
      <div style="font-size:11px;opacity:.6;margin-top:14px">(Tap card to flip)</div>
    </div>
    <div style="display:flex;justify-content:space-between;gap:8px">
      <div><button class="btn-o" onclick="step(-1)">← Prev</button> <button class="btn-o" onclick="step(1)">Next →</button></div>
      <div><button class="btn-o" onclick="rate('Review')">Review</button> <button class="btn-g" onclick="rate('Mastered')">✓ Mastered</button></div>
    </div>
  </div>

  <div id="p-scen" class="hide"></div>

  <div id="p-tools" class="hide"></div>
</div>

<div class="nav">
  <button id="n-home" class="act" onclick="show('home')"><span>📊</span>Home</button>
  <button id="n-lessons" onclick="show('lessons')"><span>📖</span>Lessons</button>
  <button id="n-cards" onclick="show('cards')"><span>🗂️</span>Cards</button>
  <button id="n-scen" onclick="show('scen')"><span>🧭</span>Scenarios</button>
  <button id="n-tools" onclick="show('tools')"><span>🧰</span>Toolkits</button>
</div>
